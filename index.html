<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Information and the Computer Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: header strip, then a dark keyboard plate where every station is a keycap; a station opens as one working panel with an Esc keycap back to the plate. */
:root{
  --paper:#ECEFF5;
  --panel:#FFFFFF;
  --ink:#151C30;
  --ink-soft:#566079;
  --line:#D6DCE7;
  --plate:#1E263E;
  --plate-edge:#2C3654;
  --plate-ink:#9AA5C2;
  --plate-hi:rgba(255,255,255,.06);
  --on-plate:#F4F6FB;
  --key:#F8F9FC;
  --key-hover:#FFFFFF;
  --key-edge:#D9DFE9;
  --key-skirt:#B4BED2;
  --key-drop:rgba(4,8,20,.32);
  --shadow:rgba(20,28,52,.16);
  --accent:#FF7A1A;
  --accent-deep:#C4560B;
  --accent-text:#A84808;
  --accent-ink:#1E1105;
  --accent-soft:#FFE7D4;
  --good:#127A45;
  --good-soft:#DCF3E6;
  --good-line:#86CFA6;
  --bad:#C9353C;
  --bad-soft:#FBE3E3;
  --bad-line:#EFA3A6;
  --star:#FFB400;
  --star-off:#C9D0DD;
  --led-on:#29D37B;
  --led-ring:rgba(41,211,123,.22);
  --led-glow:rgba(41,211,123,.55);
  --led-off:#3A4562;
  --focus:#2F6BFF;
  --link:#1F4FD6;
  --bug-leg:#2A2148;
  /* the certificate is a printed document: same paper colours in both themes */
  --cert-paper:#FFFFFF;
  --cert-ink:#151C30;
  --cert-soft:#566079;
  --cert-line:#D6DCE7;
  --cert-off:#C9D0DD;
  --cert-star:#FFB400;
  --font-display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1220; --panel:#151C2F; --ink:#E8ECF5; --ink-soft:#A0AAC2; --line:#273149;
    --plate:#070A14; --plate-edge:#1A2236; --plate-ink:#7C88A6; --plate-hi:rgba(255,255,255,.04); --on-plate:#F4F6FB;
    --key:#242D45; --key-hover:#2B3550; --key-edge:#313C59; --key-skirt:#0E1322; --key-drop:rgba(0,0,0,.5);
    --shadow:rgba(0,0,0,.5);
    --accent:#FF8A33; --accent-deep:#B5520F; --accent-text:#FF9F57; --accent-ink:#1E1105; --accent-soft:#3B2615;
    --good:#46D08A; --good-soft:#123323; --good-line:#2E7D55;
    --bad:#FF7479; --bad-soft:#3B171B; --bad-line:#8E3A3F;
    --star:#FFC53D; --star-off:#3A4562;
    --led-on:#3BE38B; --led-ring:rgba(59,227,139,.2); --led-glow:rgba(59,227,139,.6); --led-off:#0F1424;
    --focus:#86A8FF; --link:#8FB0FF; --bug-leg:#C3B5FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1220; --panel:#151C2F; --ink:#E8ECF5; --ink-soft:#A0AAC2; --line:#273149;
  --plate:#070A14; --plate-edge:#1A2236; --plate-ink:#7C88A6; --plate-hi:rgba(255,255,255,.04); --on-plate:#F4F6FB;
  --key:#242D45; --key-hover:#2B3550; --key-edge:#313C59; --key-skirt:#0E1322; --key-drop:rgba(0,0,0,.5);
  --shadow:rgba(0,0,0,.5);
  --accent:#FF8A33; --accent-deep:#B5520F; --accent-text:#FF9F57; --accent-ink:#1E1105; --accent-soft:#3B2615;
  --good:#46D08A; --good-soft:#123323; --good-line:#2E7D55;
  --bad:#FF7479; --bad-soft:#3B171B; --bad-line:#8E3A3F;
  --star:#FFC53D; --star-off:#3A4562;
  --led-on:#3BE38B; --led-ring:rgba(59,227,139,.2); --led-glow:rgba(59,227,139,.6); --led-off:#0F1424;
  --focus:#86A8FF; --link:#8FB0FF; --bug-leg:#C3B5FF;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:17px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 56px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1120px;margin:0 auto}
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft);font-size:14px}

/* ---------- top bar ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;padding-block:16px 14px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{flex:none;width:42px;height:42px;border-radius:10px;background:var(--plate);display:grid;place-items:center;box-shadow:0 3px 0 var(--key-skirt);border:1px solid var(--plate-edge)}
.brand-mark span{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--accent);letter-spacing:.06em}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-title{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.25;text-wrap:balance}
.brand-sub{font-size:13px;color:var(--ink-soft)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:600}
.score svg{width:18px;height:18px;color:var(--star)}
.score-bin{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--ink-soft);padding-left:9px;border-left:1px solid var(--line)}
.lang{display:inline-flex;gap:6px}

/* ---------- keycaps ---------- */
.key{
  --skirt:var(--key-skirt);
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:10px 18px;border:1px solid var(--key-edge);border-radius:10px;
  background:var(--key);color:var(--ink);font-weight:600;font-size:16px;line-height:1.25;text-align:center;
  cursor:pointer;box-shadow:0 4px 0 var(--skirt),0 7px 14px var(--shadow);
  transition:transform .07s ease,box-shadow .07s ease,background-color .15s ease,border-color .15s ease,opacity .15s;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.key:hover{background:var(--key-hover)}
.key:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--skirt),0 2px 5px var(--shadow)}
.key:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.key[disabled]{cursor:not-allowed;opacity:.5}
.key.primary{--skirt:var(--accent-deep);background:var(--accent);border-color:var(--accent-deep);color:var(--accent-ink)}
.key.primary:hover{background:var(--accent);filter:brightness(1.06)}
.key.small{min-height:40px;padding:7px 13px;font-size:15px;border-radius:9px}
.key.tiny{min-height:40px;min-width:44px;padding:6px 10px;font-size:13px;font-family:var(--font-mono);font-weight:700;border-radius:8px;box-shadow:0 3px 0 var(--skirt),0 5px 10px var(--shadow)}
.key.tiny[aria-pressed="true"]{background:var(--plate);color:var(--on-plate);border-color:var(--accent)}
.key svg{width:20px;height:20px;flex:none}
.key .legend{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;padding-right:8px;margin-right:2px;border-right:1px solid var(--key-edge)}
.key.primary .legend{color:var(--accent-ink);border-color:var(--accent-deep)}

/* ---------- hub ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px 48px;align-items:end;margin-bottom:28px}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.6vw,46px);line-height:1.06;letter-spacing:-.015em;text-wrap:balance;margin-bottom:14px}
.hero h1 em{font-style:normal;color:var(--accent-text)}
.hero p{color:var(--ink-soft);max-width:58ch}
.namebox{display:flex;flex-direction:column;gap:8px}
.input{width:100%;min-height:50px;font:inherit;font-size:18px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.input::placeholder{color:var(--ink-soft);opacity:.8}
.input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cert-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-top:6px}

.plate{background:var(--plate);border-radius:22px;padding:16px 18px 28px;border:1px solid var(--plate-edge);box-shadow:inset 0 1px 0 var(--plate-hi),0 22px 44px var(--shadow)}
.plate-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding:2px 4px 16px;font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--plate-ink)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 14px}
.skey{
  --skirt:var(--key-skirt);
  display:flex;flex-direction:column;align-items:stretch;gap:6px;min-height:176px;padding:12px 16px 14px;
  text-align:left;border-radius:14px;border:1px solid var(--key-edge);background:var(--key);color:var(--ink);cursor:pointer;
  box-shadow:0 6px 0 var(--skirt),0 11px 18px var(--key-drop);
  transition:transform .08s ease,box-shadow .08s ease,background-color .15s;-webkit-tap-highlight-color:transparent;
}
.skey:hover{background:var(--key-hover)}
.skey:active{transform:translateY(4px);box-shadow:0 2px 0 var(--skirt),0 4px 8px var(--key-drop)}
.skey:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.skey-top{display:flex;justify-content:space-between;align-items:center}
.skey-legend{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--ink-soft)}
.led{width:10px;height:10px;border-radius:50%;background:var(--led-off)}
.led.on{background:var(--led-on);box-shadow:0 0 0 3px var(--led-ring),0 0 12px var(--led-glow)}
.skey-ico{display:block;width:34px;height:34px;color:var(--accent-text);margin-top:4px}
.skey-ico svg{display:block;width:100%;height:100%}
.skey-txt{display:flex;flex-direction:column;gap:3px}
.skey-title{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.2;text-wrap:balance}
.skey-game{font-size:14px;color:var(--ink-soft);line-height:1.3}
.skey-stars{margin-top:auto;padding-top:6px;display:flex;gap:2px}
.skey-stars svg{width:19px;height:19px;display:block}
.st-on{color:var(--star)} .st-off{color:var(--star-off)}
.skey.boss{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "ico txt stars";align-items:center;column-gap:16px;row-gap:6px;padding:12px 22px 16px}
.skey.boss .skey-top{grid-area:top}
.skey.boss .skey-ico{grid-area:ico;width:46px;height:46px;margin:0}
.skey.boss .skey-txt{grid-area:txt}
.skey.boss .skey-title{font-size:19px}
.skey.boss .skey-stars{grid-area:stars;margin:0;padding:0}
.skey.locked{cursor:not-allowed}
.skey.locked:hover{background:var(--key)}
.skey.locked:active{transform:none;box-shadow:0 6px 0 var(--skirt),0 11px 18px var(--key-drop)}
.skey.locked .skey-ico{color:var(--ink-soft)}
.lock-ico{display:block;width:17px;height:17px;color:var(--ink-soft)}
.lock-ico svg{display:block;width:100%;height:100%}
.pips{display:flex;align-items:center;gap:4px}
.pips i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--led-on)}
.pips b{margin-left:6px;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.teacher{margin-top:30px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.teacher summary{cursor:pointer;padding:15px 18px;font-weight:700;list-style:none;display:flex;align-items:center;gap:12px}
.teacher summary::-webkit-details-marker{display:none}
.teacher summary::before{content:"";flex:none;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.teacher[open] summary::before{transform:rotate(45deg)}
.teacher summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:14px}
.teacher-body{padding:0 18px 20px;display:grid;gap:18px}
.tbl-wrap{overflow-x:auto}
.teacher table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
.teacher th,.teacher td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.teacher th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.teacher td.code{font-family:var(--font-mono);font-size:13px;white-space:nowrap}
.teacher ul{margin:0;padding-left:20px;display:grid;gap:6px;max-width:80ch}
.reset-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.reset-confirm{display:inline-flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- station frame ---------- */
.st-head{display:grid;gap:16px;margin-bottom:22px}
.st-head .esc{justify-self:start}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.code-chip{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--ink);text-transform:none}
.st-title h1{font-family:var(--font-display);font-weight:700;font-size:clamp(25px,3.4vw,36px);line-height:1.1;margin:8px 0 8px;text-wrap:balance}
.st-title p{color:var(--ink-soft);max-width:64ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.panel.tight{padding:8px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.progress{display:flex;flex-wrap:wrap;gap:5px}
.progress i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--accent)}
.progress i.cur{background:var(--ink)}
.pnum{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.fb{display:none}
.fb.good,.fb.bad,.fb.info{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:16px;margin-top:4px}
.fb.good{background:var(--good-soft);border:1px solid var(--good-line)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad-line)}
.fb.info{background:var(--paper);border:1px solid var(--line)}
.fb-ico{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--panel);font-weight:800;font-size:14px;line-height:1}
.fb.good .fb-ico{background:var(--good)} .fb.bad .fb-ico{background:var(--bad)} .fb.info .fb-ico{background:var(--ink-soft)}
.fb b{font-weight:700}
.next-row{display:flex;justify-content:flex-end;margin-top:16px}
.sort-h{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:14px}

/* multiple choice */
.mc-q{font-size:20px;font-weight:600;line-height:1.35;max-width:62ch;text-wrap:pretty}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;margin:18px 0 12px}
.choice{justify-content:flex-start;text-align:left;min-height:58px;padding:12px 16px;font-weight:500}
.choice.mono{font-family:var(--font-mono);font-size:15px}
.choice[disabled],.bin[disabled]{opacity:1;cursor:default}
.key.is-right{background:var(--good-soft);border-color:var(--good);--skirt:var(--good)}
.key.is-wrong{background:var(--bad-soft);border-color:var(--bad);--skirt:var(--bad)}
.key.is-dim,.key.is-dim[disabled]{opacity:.45}
@media (max-width:640px){.choices{grid-template-columns:minmax(0,1fr)}}

/* sorter */
.sort-card{display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:14px;background:var(--paper);border:1px dashed var(--line);margin-bottom:20px;min-height:116px}
.sort-card.enter{animation:pop .28s ease}
.sort-emoji{flex:none;width:78px;height:78px;border-radius:18px;display:grid;place-items:center;font-size:44px;line-height:1;background:var(--panel);border:1px solid var(--line)}
.sort-label{font-family:var(--font-display);font-weight:700;font-size:clamp(17px,2.3vw,23px);line-height:1.28;text-wrap:balance;min-width:0}
.bins{display:grid;gap:16px 10px;margin-bottom:12px}
.bins-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.bins-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.bins-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.bin{flex-direction:column;gap:6px;min-height:96px;padding:12px 10px}
.bin svg{width:28px;height:28px;color:var(--accent-text)}
.bin-txt{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.bin b{font-size:15.5px;line-height:1.2}
.bin small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);line-height:1.25;margin-top:3px}
@media (max-width:720px){.bins-5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:460px){
  .bins-5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bins-3{grid-template-columns:minmax(0,1fr)}
  .bins-3 .bin,.bins-2 .bin{flex-direction:row;justify-content:flex-start;min-height:60px}
  .bins-3 .bin-txt,.bins-2 .bin-txt{align-items:flex-start;text-align:left}
  .sort-card{padding:14px;gap:14px}
  .sort-emoji{width:62px;height:62px;font-size:36px}
}

/* ergonomics */
.ergo{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;align-items:start}
.scene{position:relative;border-radius:10px;overflow:hidden;cursor:crosshair;touch-action:manipulation}
.scene svg{display:block;width:100%;height:auto}
.scene svg.right{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .9s ease}
.scene.solved{cursor:default}
.scene.solved svg.right{opacity:1}
.fm-ring{fill:none;stroke:var(--accent);stroke-width:5}
.fm-dot{fill:var(--accent)}
.ok-dot{fill:var(--good)}
.fm-num,.ok-num{font-family:var(--font-mono);font-weight:700;font-size:16px;text-anchor:middle;dominant-baseline:central}
.fm-num{fill:var(--accent-ink)}
.ok-num{fill:var(--on-plate)}
.fmark,.okmark{animation:pop .3s ease}
.miss path{stroke:var(--bad);stroke-width:5;stroke-linecap:round;fill:none}
.miss{animation:missfade .9s ease forwards}
.pulse{fill:none;stroke:var(--focus);stroke-width:5;animation:pulse 1s ease-in-out infinite}
.side-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.counter{font-family:var(--font-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.flist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
.flist li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.flist .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:14px}
.flist.ok .n{background:var(--good);color:var(--on-plate)}
.flist b{display:block;font-size:15.5px;line-height:1.3}
.flist .tip{display:block;font-size:14.5px;color:var(--ink-soft);line-height:1.4;margin-top:2px}
.flist li.empty{display:block;color:var(--ink-soft);font-size:14.5px}

function load(data) {

  const src = (data && data.progress) || saved;
  state.lang = LANG;
  if (src && typeof src === 'object') {

    if (typeof src.doneAt === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(src.doneAt)) state.doneAt = src.doneAt;
    if (typeof src.sound === 'boolean') state.sound = src.sound;

}

/* ---------------- sound & confetti ---------------- */
let actx = null;
function sfx(kind) {
  if (!state.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    actx = actx || new AC();
    if (actx.state === 'suspended') actx.resume();
    const now = actx.currentTime + 0.01;
    const seq = {
      good:[[660,0,.09],[880,.09,.16]], bad:[[196,0,.2]], tap:[[540,0,.04]],
      win:[[523,0,.1],[659,.1,.1],[784,.2,.1],[1047,.3,.26]], hit:[[300,0,.07],[150,.06,.14]]
    }[kind] || [];
    for (const [f, t, d] of seq) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = (kind === 'bad' || kind === 'hit') ? 'square' : 'triangle';
      o.frequency.value = f;
      const peak = (kind === 'bad' || kind === 'hit') ? 0.035 : 0.08;
      g.gain.setValueAtTime(0.0001, now + t);
      g.gain.exponentialRampToValueAtTime(peak, now + t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + d);
      o.connect(g); g.connect(actx.destination);
      o.start(now + t); o.stop(now + t + d + 0.03);
    }

}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#ff7a1a'; }
let confettiRun = 0;
function stopConfetti() {
  confettiRun++;
  const c = $('#confetti'); if (!c) return;
  try { c.getContext('2d').clearRect(0, 0, c.width, c.height); } catch (e) { /* ignore */ }
  c.hidden = true;
}
function confetti() {
  if (reduceMotion) return;
  const c = $('#confetti'); if (!c || !c.getContext) return;
  const run = ++confettiRun;
  const ctx = c.getContext('2d'); const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = c.width = Math.round(window.innerWidth * dpr), H = c.height = Math.round(window.innerHeight * dpr);
  c.hidden = false;
  const cols = ['--accent', '--star', '--good', '--focus', '--led-on'].map(cssVar);
  const P = Array.from({ length: 150 }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .35, y: H * .32,
    vx: (Math.random() - .5) * 15 * dpr, vy: (-Math.random() * 13 - 4) * dpr,
    s: (5 + Math.random() * 6) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
    c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  (function frame(t) {
    if (run !== confettiRun) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.vy += .38 * dpr; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    }

  })(t0);
}

  box.innerHTML = `

  clearBtn.addEventListener('click', () => { if (solved) return; bits = [0, 0, 0, 0, 0]; renderBits(); });

/* ---------------- station: search ---------------- */
function buildRound(box, R, addErr) {
  const toks = R.tokens[state.lang].map(([w, k]) => ({ w, k }));
  const keys = toks.map((t, k) => (t.k === 'key' ? k : -1)).filter(k => k >= 0);
  let picked = [], tries = 0, finished = false;
  box.innerHTML = `
    <div class="ask"><span class="ask-ava" aria-hidden="true">${ICON.chat}</span><div class="ask-bubble"><span class="label">${T('friendAsks')}</span><p>${esc(quote(L(R.q)))}</p></div></div>
    <p class="task">${T('buildTask')}</p>
    <div class="sbar"><span class="sbar-ico">${ICON.search}</span><div class="sbar-q" aria-live="polite"></div><button class="key primary small sgo" type="button">${T('find')}</button></div>
    <div class="words">${toks.map((t, k) => `<button class="key small word" type="button" data-k="${k}">${esc(t.w)}</button>`).join('')}</div>
    <div class="fb" aria-live="polite"></div>
    <div class="rcard" hidden></div>
    <div class="next-row"><button class="key primary nextbtn" type="button" hidden>${T('next')} →</button></div>`;
  const q = $('.sbar-q', box), fb = $('.fb', box), rc = $('.rcard', box), nb = $('.nextbtn', box), go = $('.sgo', box), words = $$('.word', box);
  function renderQ() {
    q.innerHTML = picked.length
      ? picked.map(k => `<button class="qchip" type="button" data-k="${k}" aria-label="${esc(T('remove') + ': ' + toks[k].w)}">${esc(toks[k].w)}</button>`).join('')
      : `<span class="ph">${T('queryPh')}</span>`;
    words.forEach(b => { const used = picked.includes(+b.dataset.k); b.classList.toggle('used', used); b.disabled = used || finished; });
    $$('.qchip', q).forEach(c => c.addEventListener('click', () => {
      if (finished) return;
      picked = picked.filter(k => k !== +c.dataset.k); sfx('tap'); renderQ();
    }));
  }
  words.forEach(b => b.addEventListener('click', () => {
    if (finished) return;
    const k = +b.dataset.k;
    if (!picked.includes(k)) { picked.push(k); sfx('tap'); renderQ(); }
  }));
  go.addEventListener('click', () => {
    if (finished) return;
    if (!picked.length) { setFb(fb, 'info', '', T('empty')); return; }
    const missing = keys.filter(k => !picked.includes(k));
    const extra = picked.filter(k => toks[k].k === 'x');
    if (!missing.length && !extra.length) {
      finished = true; sfx('good');
      setFb(fb, 'good', T('right'), T('perfect'));
      rc.hidden = false;
      rc.innerHTML = `<span class="label">${T('topResult')}</span><div class="rt">${esc(L(R.res).t)}</div><div class="rs">${esc(L(R.res).s)}</div>`;
      go.disabled = true; renderQ(); nb.hidden = false;
      return;
    }
    tries++; addErr(); sfx('bad');
    const parts = [];
    if (missing.length) parts.push(fmt(T('missing'), { w: missing.map(k => quote(toks[k].w)).join(', ') }));
    if (extra.length) parts.push(fmt(T('extra'), { w: extra.map(k => quote(toks[k].w)).join(', ') }));
    if (tries >= 2) {
      finished = true;
      parts.push(fmt(T('showAns'), { q: keys.map(k => toks[k].w).join(' ') }));
      picked = keys.slice(); go.disabled = true; renderQ(); nb.hidden = false;
    }
    setFb(fb, 'bad', T('wrong'), parts.join(' '));
  });
  renderQ();
  return new Promise(res => nb.addEventListener('click', () => res(), { once: true }));
}

function runSearch(body) {
  body.innerHTML = `<div class="panel"><div class="ptop"><div class="progress" aria-hidden="true"></div><div class="pnum"></div></div><div class="qbox"></div></div>`;
  const prog = $('.progress', body), pnum = $('.pnum', body), qbox = $('.qbox', body);
  let r = 0, errors = 0;
  const step = () => {
    if (!body.isConnected) return;
    if (r >= SEARCH.length) { finishStation('search', starsBy(errors, 1, 3), { errors }); return; }
    prog.innerHTML = progressHTML(SEARCH.length, r); pnum.textContent = `${r + 1} / ${SEARCH.length}`;
    const R = SEARCH[r];

    p.then(() => { r++; step(); });

  step();
}

/* ---------------- station: history ---------------- */
function runHistory(body) {
  const n = HIST.length;
  let pool = shuffle(HIST.map((_, k) => k));
  while (pool.every((v, k) => v === k)) pool = shuffle(pool);
  const slots = Array(n).fill(null), locked = Array(n).fill(false);
  let fails = 0, busy = false;
  body.innerHTML = `
    <div class="panel">
      <div class="axis"><span class="label">${T('oldest')}</span><span class="axis-line" aria-hidden="true"></span><span class="label">${T('newest')}</span></div>

      <div class="label">${T('cards')}</div>
      <div class="pool"></div>
      <button class="key primary hcheck" type="button" disabled>${T('check')}</button>
      <div class="fb" aria-live="polite"></div>
    </div>`;
  const slotsEl = $('.slots', body), poolEl = $('.pool', body), chk = $('.hcheck', body), fb = $('.fb', body);
  const card = (k, lock) => `<button class="hcard" type="button" data-k="${k}"${lock ? ' disabled' : ''}><span class="em" aria-hidden="true">${HIST[k].icon}</span><span>${esc(L(HIST[k]).n)}</span></button>`;
  function render() {
    slotsEl.innerHTML = slots.map((k, s) => `<li class="slot${locked[s] ? ' ok' : ''}" data-s="${s}"><span class="slot-n">${s + 1}</span>${k === null ? '' : card(k, locked[s])}</li>`).join('');
    const inSlots = new Set(slots.filter(k => k !== null));
    poolEl.innerHTML = pool.filter(k => !inSlots.has(k)).map(k => card(k, false)).join('');
    chk.disabled = busy || slots.some(k => k === null);
    $$('.hcard', poolEl).forEach(b => b.addEventListener('click', () => {
      if (busy) return;
      const s = slots.indexOf(null); if (s < 0) return;
      slots[s] = +b.dataset.k; sfx('tap'); render();
    }));
    $$('.slot .hcard', slotsEl).forEach(b => b.addEventListener('click', () => {
      if (busy) return;
      const s = +b.closest('.slot').dataset.s; if (locked[s]) return;
      slots[s] = null; sfx('tap'); render();
    }));
  }
  chk.addEventListener('click', () => {
    if (busy || slots.some(k => k === null)) return;
    const wrong = [];
    slots.forEach((k, s) => { if (k === s) locked[s] = true; else wrong.push(s); });
    if (!wrong.length) { sfx('win'); reveal(); return; }
    fails++; sfx('bad'); busy = true; render();
    wrong.forEach(s => slotsEl.children[s].classList.add('bad'));
    setFb(fb, 'bad', T('wrong'), fmt(T('fixRed'), { n: n - wrong.length, all: n }));
    setTimeout(() => { if (!body.isConnected) return; wrong.forEach(s => { slots[s] = null; }); busy = false; render(); }, 1300);
  });
  function reveal() {
    body.innerHTML = `
      <div class="panel">
        <div class="fb good"><span class="fb-ico" aria-hidden="true">✓</span><span><b>${T('right')}</b> ${T('allRight')}</span></div>
        <ol class="tl">${HIST.map(h => `<li><span class="tl-date">${esc(L(h).d)}</span><span><span class="tl-name"><span aria-hidden="true">${h.icon}</span>${esc(L(h).n)}</span><span class="tl-fact">${esc(L(h).f)}</span></span></li>`).join('')}</ol>
        <div class="next-row"><button class="key primary hdone" type="button">${T('claim')} →</button></div>
      </div>`;
    $('.hdone', body).addEventListener('click', () => finishStation('history', fails === 0 ? 3 : fails === 1 ? 2 : 1, { tries: fails + 1 }));
  }
  render();
}

function runBoss(body) {
  const queue = BOSS.map((_, k) => k);
  let hp = BOSS.length, mistakes = 0;
  body.innerHTML = `
    <div class="boss-wrap">
      <div class="panel boss-side">
        <div class="bug-stage">${bugSVG()}</div>
        <div class="hp"><div class="label">${T('hp')}</div><div class="hp-bar">${'<i></i>'.repeat(hp)}</div></div>
        <div class="boss-say" aria-live="polite"></div>
      </div>
      <div class="panel boss-main"><div class="ptop"><span class="label qleft"></span></div><div class="qbox"></div></div>
    </div>`;
  const bug = $('.bug', body), hpEls = $$('.hp-bar i', body), say = $('.boss-say', body), qleft = $('.qleft', body), qbox = $('.qbox', body);
  const upd = () => hpEls.forEach((e, k) => e.classList.toggle('gone', k >= hp));
  const anim = cls => { bug.classList.remove('hit', 'laugh'); void bug.getBoundingClientRect(); bug.classList.add(cls); };
  function step() {
    if (!body.isConnected) return;
    if (!queue.length) { win(); return; }
    qleft.textContent = fmt(T('left'), { n: queue.length });
    const k = queue.shift();
    mcQuestion(qbox, BOSS[k], ok => {
      if (ok) { hp--; anim('hit'); say.textContent = T('hit'); sfx('hit'); }
      else { mistakes++; queue.push(k); anim('laugh'); say.textContent = T('miss'); sfx('bad'); }
      upd();
    }, { quiet: true }).then(step);
  }
  function win() {
    bug.classList.remove('hit', 'laugh'); bug.classList.add('dead');
    say.textContent = T('won'); qleft.textContent = ''; sfx('win');
    // Winning the final battle completes the quest: save the stars now, then open the certificate.
    recordStars('boss', mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1); renderHeader();
    qbox.innerHTML = `<div class="fb good"><span class="fb-ico" aria-hidden="true">✓</span><span><b>${T('won')}</b> ${T('winText')}</span></div>
      <div class="next-row"><button class="key primary bdone" type="button">${ICON.cert}<span>${T('getCert')}</span></button></div>`;
    let opened = false;
    const open = () => { if (opened || !body.isConnected) return; opened = true; go('cert', { fresh: true }); };
    $('.bdone', body).addEventListener('click', open);
    setTimeout(open, 3000);
  }
  upd(); step();
}

/* Saves the best result for a station; returns true when this result completes the whole quest. */
function recordStars(id, stars) {
  const wasDone = questDone();
  state.stars[id] = Math.max(state.stars[id] || 0, stars);

}
/* Next station to suggest: the next unfinished one of keys 1–6, then the final battle. */

  return state.stars.boss ? null : byId('boss');
}

  go('result', Object.assign({ id, stars }, stat));
}

/* Printable certificate: drawn on a canvas, then wrapped in a one-page A4 PDF. */
const CERT_FONT = {
  display: '"Unbounded", "Trebuchet MS", Arial, sans-serif',
  body: '"Golos Text", "Segoe UI", Roboto, Arial, sans-serif',
  mono: '"JetBrains Mono", Consolas, "Courier New", monospace'

const STAR_PATH = 'M12 2.6l2.85 5.95 6.5.78-4.8 4.52 1.24 6.45L12 17.1l-5.79 3.2 1.24-6.45-4.8-4.52 6.5-.78z';
function loadCertFonts(text) {

  const faces = [`700 96px ${CERT_FONT.display}`, `500 28px ${CERT_FONT.body}`, `600 28px ${CERT_FONT.body}`, `700 28px ${CERT_FONT.body}`, `700 24px ${CERT_FONT.mono}`];
  // Passing the real text makes the browser fetch the Cyrillic/Kazakh subsets a name may need.
  return Promise.race([
    Promise.all(faces.map(f => document.fonts.load(f, text || 'A').catch(() => null))),
    new Promise(r => setTimeout(r, 2500))

}
function roundRect(g, x, y, w, h, r) {

  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function spacedText(g, text, x, y, spacing) {
  let cx = x;
  for (const ch of text) { g.fillText(ch, cx, y); cx += g.measureText(ch).width + spacing; }
  return cx - x - spacing;
}
function drawStar(g, x, y, size) {
  g.save(); g.translate(x, y); g.scale(size / 24, size / 24); g.fill(new Path2D(STAR_PATH)); g.restore();
}
function wrapLines(g, text, maxW) {
  const lines = []; let line = '';

    if (line && g.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t;
  }

}
async function drawCertificate(d) {
  const total = starsOf(d), name = d.name;
  await loadCertFonts([name, T('appTitle'), T('unit'), T('certTitle'), T('certAwarded'), T('certFor'), rankText(total),
    T('starsWord'), T('dateLbl'), T('sign'), certDate(d), ST.map(s => L(s).k).join(' '), '0123456789/'].join(' '));
  const W = 1754, H = 1240; // A4 landscape at 150 dpi
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;

  g.fillStyle = '#FFFFFF'; g.fillRect(fx, fy, fw, fh);
  g.lineWidth = 6; g.strokeStyle = C.ink; g.strokeRect(fx, fy, fw, fh);
  g.lineWidth = 2; g.strokeStyle = C.line; g.strokeRect(fx + 18, fy + 18, fw - 36, fh - 36);
  // brand row
  g.fillStyle = C.plate; roundRect(g, X0, 118, 60, 60, 12); g.fill();
  g.fillStyle = C.accent; g.font = `700 24px ${CERT_FONT.mono}`; g.textAlign = 'center'; g.fillText('01', X0 + 30, 157); g.textAlign = 'left';
  g.fillStyle = C.soft; g.font = `700 20px ${CERT_FONT.mono}`; spacedText(g, T('appTitle').toUpperCase(), X0 + 82, 143, 3);
  g.font = `500 22px ${CERT_FONT.body}`; g.fillText(T('unit'), X0 + 82, 173);
  // punched strip: one hole per star earned
  const max = ST.length * 3, gap = 10, sw = (CW - gap * (max - 1)) / max;
  for (let k = 0; k < max; k++) {
    roundRect(g, X0 + k * (sw + gap), 214, sw, 28, 5);
    if (k < total) { g.fillStyle = C.ink; g.fill(); } else { g.lineWidth = 2; g.strokeStyle = C.line; g.stroke(); }
  }
  // title and name
  g.fillStyle = C.ink; g.font = `700 62px ${CERT_FONT.display}`; g.fillText(T('certTitle'), X0, 336);
  g.fillStyle = C.soft; g.font = `500 30px ${CERT_FONT.body}`; g.fillText(T('certAwarded'), X0, 398);
  let fs = 108; g.font = `700 ${fs}px ${CERT_FONT.display}`;
  while (g.measureText(name).width > CW && fs > 40) { fs -= 4; g.font = `700 ${fs}px ${CERT_FONT.display}`; }
  g.fillStyle = C.ink; g.fillText(name, X0, 516);
  g.fillStyle = C.accent; g.fillRect(X0, 542, Math.max(220, Math.min(CW, g.measureText(name).width)), 10);
  // rank pill
  const rank = rankText(total);
  g.font = `700 30px ${CERT_FONT.body}`;
  const rw = g.measureText(rank).width + 56;
  g.fillStyle = C.accent; roundRect(g, X0, 586, rw, 58, 29); g.fill();
  g.fillStyle = C.accentInk; g.fillText(rank, X0 + 28, 626);
  // what it was awarded for
  g.fillStyle = C.ink; g.font = `500 30px ${CERT_FONT.body}`;
  wrapLines(g, T('certFor'), CW).slice(0, 2).forEach((ln, i) => g.fillText(ln, X0, 708 + i * 40));
  // stars total, with the same number in binary
  g.fillStyle = C.star; drawStar(g, X0 - 3, 742, 50);
  const st = `${total} / ${max} ${T('starsWord')}`;
  g.fillStyle = C.ink; g.font = `700 42px ${CERT_FONT.display}`; g.fillText(st, X0 + 62, 784);
  const stw = g.measureText(st).width;
  g.fillStyle = C.soft; g.font = `700 26px ${CERT_FONT.mono}`; spacedText(g, total.toString(2).padStart(5, '0'), X0 + 62 + stw + 28, 782, 6);
  // stars per station
  const cols = 4, cw = CW / cols;
  ST.forEach((s, k) => {
    const x = X0 + (k % cols) * cw, y = 834 + Math.floor(k / cols) * 100, n = d.stars[s.id] || 0;
    g.fillStyle = C.ink; g.font = `600 24px ${CERT_FONT.body}`; g.fillText(L(s).k, x, y + 26);
    for (let i = 0; i < 3; i++) { g.fillStyle = i < n ? C.star : C.off; drawStar(g, x + i * 34 - 3, y + 38, 32); }
    g.strokeStyle = C.line; g.lineWidth = 2; g.setLineDash([6, 6]);
    g.beginPath(); g.moveTo(x, y + 84); g.lineTo(x + cw - 30, y + 84); g.stroke(); g.setLineDash([]);
  });

  g.fillStyle = C.soft; g.font = `700 18px ${CERT_FONT.mono}`; spacedText(g, T('dateLbl').toUpperCase(), X0, 1076, 3);
  g.fillStyle = C.ink; g.font = `600 30px ${CERT_FONT.body}`; g.fillText(certDate(d), X0, 1114);
  const sx = X1 - 470;
  g.strokeStyle = C.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(sx, 1094); g.lineTo(X1, 1094); g.stroke();

}
/* PDF text string as UTF-16BE hex, so Cyrillic names survive in the document title. */
const pdfHex = s => '<FEFF' + Array.from(String(s)).map(ch => {

  return (0xD800 + (v >> 10)).toString(16) + (0xDC00 + (v & 0x3FF)).toString(16);

function canvasToPdf(cv, d) {

  const obj = (n, ...chunks) => { offsets[n] = len; put(`${n} 0 obj\n`); chunks.forEach(c => put(c)); put('\nendobj\n'); };
  const PW = 842, PH = 595; // A4 landscape in points
  const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  put('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  obj(4, `<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`, img, '\nendstream');
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  obj(6, `<< /Title ${pdfHex(T('certTitle') + ' - ' + d.name)} /Producer ${pdfHex(T('appTitle'))} >>`);
  const xref = len;
  put('xref\n0 7\n0000000000 65535 f \n');
  for (let i = 1; i <= 6; i++) put(`${String(offsets[i]).padStart(10, '0')} 00000 n \n`);

function go(screen, arg) {
  stopConfetti();
  current = { screen, arg };
  try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  renderHeader();
  if (screen === 'station') startStation(arg);
  else if (screen === 'result') renderResult(arg);
  else if (screen === 'cert') renderCert(arg);
  else { current = { screen: 'hub', arg: null }; renderHub(); }
}

/* ---------------- events ---------------- */
view.addEventListener('click', e => {
  const st = e.target.closest('[data-st]');
  if (st && view.contains(st)) { sfx('tap'); go('station', st.dataset.st); return; }
  const b = e.target.closest('[data-act]'); if (!b || !view.contains(b)) return;
  const act = b.dataset.act;
  if (act === 'hub') go('hub');
  else if (act === 'cert') go('cert');
  else if (act === 'sample') go('cert', { sample: true });
  else if (act === 'reset') { const c = $('.reset-confirm', view); if (c) c.hidden = false; }
  else if (act === 'reset-no') { const c = $('.reset-confirm', view); if (c) c.hidden = true; }
  else if (act === 'reset-yes') { state.stars = {}; state.name = ''; state.doneAt = ''; save(); go('hub'); }
});
$('#soundBtn').addEventListener('click', () => { state.sound = !state.sound; save(); renderHeader(); if (state.sound) sfx('tap'); });
